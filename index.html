<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LONVIQ — Kollagen Beauty</title>
<meta name="description" content="LONVIQ Kollagen Beauty — full dose collagen supplement with 14,710mg collagen peptides, Vitamin C, Zinc and Biotin. No magic. Just ingredients.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --salmon:#D4967A;--salmon-l:#F5EDE8;--gold:#B8860B;
  --dark:#1E1612;--dark-mid:#3D2B22;--gray:#8A7A72;--gray-l:#C4B8B2;
  --cream:#FAFAF8;--white:#fff;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',Helvetica,sans-serif;
  --label:'Montserrat',Helvetica,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--dark);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(250,250,248,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--salmon-l);padding:0 48px;height:68px;display:flex;align-items:center;justify-content:space-between;transition:all .3s}
.nav-logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.nav-logo-sym{font-family:var(--serif);font-size:20px;color:var(--gold);line-height:1}
.nav-logo-txt{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.18em;color:var(--dark)}
.nav-links{display:flex;gap:36px}
.nav-links a{font-size:11px;font-family:var(--label);font-weight:600;letter-spacing:.09em;color:var(--dark-mid);transition:color .2s}
.nav-links a:hover{color:var(--salmon)}
.nav-right{display:flex;align-items:center;gap:20px}
.lang-toggle{display:flex;border:1px solid var(--salmon-l);border-radius:20px;overflow:hidden}
.lang-btn{padding:5px 14px;font-size:11px;font-family:var(--label);font-weight:700;letter-spacing:.08em;border:none;cursor:pointer;background:transparent;color:var(--gray);transition:all .2s}
.lang-btn.active{background:var(--salmon);color:#fff}
.nav-cta{background:var(--dark);color:#fff;font-size:11px;padding:10px 22px;border-radius:2px;font-family:var(--label);font-weight:700;letter-spacing:.09em;transition:background .2s}
.nav-cta:hover{background:var(--dark-mid)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--dark);transition:all .3s}
.mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(250,250,248,0.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--salmon-l);padding:24px 20px;z-index:99;flex-direction:column;gap:20px}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:13px;font-family:var(--label);font-weight:600;letter-spacing:.09em;color:var(--dark-mid);padding:8px 0;border-bottom:1px solid var(--salmon-l)}
.mobile-menu .m-cta{background:var(--dark);color:#fff;padding:14px 24px;border-radius:2px;text-align:center;font-size:12px;margin-top:4px;border:none}

/* EYEBROW */
.eyebrow{font-size:10px;letter-spacing:.22em;font-weight:700;font-family:var(--label);color:var(--salmon);margin-bottom:16px;text-transform:uppercase}
.eyebrow.light{color:rgba(212,150,122,.9)}

/* HERO */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 68px)}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:80px 52px 80px 64px;gap:28px}
.hero-h1{font-family:var(--serif);font-size:72px;line-height:.93;font-weight:700;letter-spacing:-.01em;color:var(--dark)}
.hero-h1 .accent{color:var(--salmon)}
.hero-sub{font-family:var(--sans);font-size:15.5px;color:var(--dark-mid);line-height:1.75;font-weight:300;max-width:400px;white-space:pre-line}
.hero-cta-wrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn-primary{display:inline-block;background:var(--dark);color:#fff;padding:15px 38px;font-size:12px;letter-spacing:.12em;font-family:var(--label);font-weight:700;border-radius:2px;transition:background .2s;cursor:pointer;border:none}
.btn-primary:hover{background:var(--dark-mid)}
.btn-sub{font-size:11px;color:var(--gray);font-family:var(--sans);font-weight:400}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--salmon-l);padding-top:26px;margin-top:4px}
.stat{padding-left:20px;border-left:1px solid var(--salmon-l)}
.stat:first-child{padding-left:0;border-left:none}
.stat-n{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--dark);letter-spacing:-.01em}
.stat-l{font-size:10px;color:var(--gray);font-family:var(--sans);line-height:1.5;white-space:pre-line;margin-top:3px;font-weight:400}
.hero-photo{position:relative;overflow:hidden;min-height:560px}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(250,250,248,.22) 0%,transparent 22%);pointer-events:none}

/* TRUTH */
.truth{background:#fff;padding:110px 68px}
.truth-inner{max-width:920px;margin:0 auto}
.truth-h2{font-family:var(--serif);font-size:48px;color:var(--dark);margin:0 0 16px;white-space:pre-line;line-height:1.08;font-weight:600}
.truth-sub{font-family:var(--sans);font-size:15px;color:var(--gray);max-width:520px;line-height:1.75;margin:0 0 40px;font-weight:300}
/* column headers */
.truth-cols-header{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:0}
.truth-col-label{font-family:var(--label);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:10px 20px 10px 0;color:var(--gray-l)}
.truth-col-label.right{padding-left:20px;padding-right:0;color:var(--salmon);border-left:2px solid var(--salmon)}
/* rows */
.truth-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--salmon-l);padding:0}
.truth-std{padding:18px 20px 18px 0;font-family:var(--sans);font-size:13px;color:var(--gray);line-height:1.5;font-weight:400}
.truth-lnv{padding:18px 0 18px 20px;font-family:var(--sans);font-size:13px;color:var(--dark);font-weight:600;line-height:1.5;border-left:2px solid var(--salmon)}
.truth-arrow{color:var(--salmon-l);margin:0 4px;font-size:12px}
.truth-border{border-top:1px solid var(--salmon-l)}
.truth-fn{font-size:10px;color:var(--gray-l);font-family:var(--sans);margin-top:20px;letter-spacing:.04em}
@media(max-width:767px){
  .truth-std,.truth-lnv{padding:14px 12px 14px 0;font-size:12px}
  .truth-lnv{padding-left:12px}
}

/* PRODUCT */
.product{background:var(--salmon-l);padding:110px 68px}
.product-inner{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:88px;align-items:center}
.product-photo{aspect-ratio:4/5;overflow:hidden;border-radius:3px}
.product-copy{display:flex;flex-direction:column;gap:26px}
.product-h2{font-family:var(--serif);font-size:44px;color:var(--dark);margin:0 0 6px;font-weight:600}
.product-wt{font-size:11px;color:var(--gray);font-family:var(--label);letter-spacing:.07em;font-weight:500}
.product-desc{font-family:var(--sans);font-size:15px;color:var(--dark-mid);line-height:1.75;font-weight:300}
.ing-list{display:flex;flex-direction:column}
.ing-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;padding:16px 0;border-top:1px solid rgba(212,150,122,.25)}
.ing-icon{width:40px;height:40px;border-radius:20px;border:1.5px solid var(--salmon);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--salmon);font-weight:700;font-family:var(--label);flex-shrink:0}
.ing-name{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--dark)}
.ing-claim{font-family:var(--sans);font-size:11px;color:var(--gray);margin-top:2px}
.ing-dose{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--salmon);white-space:nowrap}
.ing-border{border-top:1px solid rgba(212,150,122,.25)}
.product-cta-wrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.product-legal{font-size:10px;color:var(--gray);font-family:var(--sans)}

/* HOWTO */
.howto{background:#fff;padding:110px 68px}
.howto-inner{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:88px;align-items:center}
.howto-copy{display:flex;flex-direction:column;gap:32px}
.howto-h2{font-family:var(--serif);font-size:44px;color:var(--dark);margin:0;white-space:pre-line;line-height:1.08;font-weight:600}
.steps{display:flex;flex-direction:column;gap:24px}
.step{display:grid;grid-template-columns:36px 1fr;gap:16px;align-items:flex-start}
.step-n{font-family:var(--serif);font-size:28px;color:var(--salmon);font-weight:600;line-height:1.1}
.step-t{font-family:var(--sans);font-size:14px;color:var(--dark-mid);line-height:1.75;font-weight:300}
.howto-note{background:var(--salmon-l);padding:18px 22px;border-radius:2px;border-left:3px solid var(--salmon);font-family:var(--sans);font-size:13px;color:var(--dark-mid);line-height:1.65}
.howto-photo{aspect-ratio:4/5;overflow:hidden;border-radius:3px}

/* WOMEN */
.women{background:var(--cream);padding:110px 68px}
.women-inner{max-width:1220px;margin:0 auto}
.women-head{display:grid;grid-template-columns:300px 1fr;gap:80px;margin-bottom:64px;align-items:end}
.women-h2{font-family:var(--serif);font-size:44px;color:var(--dark);margin:0 0 16px;white-space:pre-line;line-height:1.08;font-weight:600}
.women-sub{font-family:var(--sans);font-size:14px;color:var(--gray);line-height:1.75;font-weight:300}
.women-tagline{font-family:var(--sans);font-size:13px;color:var(--gray-l);font-weight:300;font-style:italic;text-align:right}
/* mixed grid — spójny układ 3+2 */
.women-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* card base */
.wcard{position:relative;overflow:hidden;border-radius:3px;background:#e8ddd8}
.wcard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.wcard:hover img{transform:scale(1.04)}
/* wszystkie karty w pierwszym rzędzie — jednakowa wysokość 420px */
.wcard.tall{height:420px}
/* drugi rząd: W4 span 2 + W5 span 1 — ta sama wysokość */
.wcard.wide{grid-column:span 2;height:420px}
.wcard.side{height:420px}
/* quote overlay — zawsze widoczny */
.wcard-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,9,5,0.82) 0%,rgba(18,9,5,0.35) 48%,transparent 72%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px 22px}
.overlay-quote{font-family:var(--serif);font-size:14.5px;color:#fff;font-style:italic;line-height:1.55;margin-bottom:9px}
.overlay-name{font-family:var(--label);font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.12em;font-weight:600}

/* ABOUT */
.about{background:var(--dark);padding:110px 68px}
.about-inner{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:88px}
.about-left{display:flex;flex-direction:column;gap:28px}
.about-h2{font-family:var(--serif);font-size:48px;color:#fff;margin:0;white-space:pre-line;line-height:1.08;font-weight:600}
.about-body{font-family:var(--sans);font-size:15px;color:rgba(255,255,255,.6);line-height:1.85;white-space:pre-line;font-weight:300}
.values{display:flex;flex-direction:column}
.value-row{border-top:1px solid rgba(255,255,255,.08);padding:24px 0;display:grid;grid-template-columns:170px 1fr;gap:24px}
.value-lbl{font-family:var(--label);font-size:11px;color:var(--salmon);font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.value-txt{font-family:var(--sans);font-size:14px;color:rgba(255,255,255,.6);line-height:1.65;font-weight:300}
.value-border{border-top:1px solid rgba(255,255,255,.08)}

/* NEWSLETTER */
.newsletter{background:#180F0B;border-top:1px solid rgba(255,255,255,.05);padding:90px 68px;text-align:center}
.newsletter-h2{font-family:var(--serif);font-size:38px;color:#fff;margin:0 0 16px;white-space:pre-line;line-height:1.15;font-weight:600}
.newsletter-sub{font-family:var(--sans);font-size:14px;color:rgba(255,255,255,.45);margin:0 0 40px;line-height:1.75;font-weight:300}
.email-row{display:flex;max-width:440px;margin:0 auto 14px}
.email-inp{flex:1;padding:14px 18px;font-size:13px;font-family:var(--sans);font-weight:300;border:1px solid rgba(255,255,255,.12);border-right:none;background:rgba(255,255,255,.05);color:#fff;outline:none;border-radius:2px 0 0 2px}
.email-inp::placeholder{color:rgba(255,255,255,.3)}
.email-btn{background:var(--salmon);color:#fff;border:none;padding:14px 26px;font-size:11px;letter-spacing:.12em;font-family:var(--label);font-weight:700;cursor:pointer;border-radius:0 2px 2px 0;transition:background .2s}
.email-btn:hover{background:var(--dark-mid)}
.nl-legal{font-size:10px;color:rgba(255,255,255,.2);font-family:var(--sans);font-weight:300}
.nl-done{color:var(--salmon);font-family:var(--sans);font-size:15px;margin:0 0 14px}

/* FOOTER */
.footer{background:#100B08;padding:44px 68px 28px}
.footer-inner{max-width:1120px;margin:0 auto}
.footer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.footer-brand{display:flex;align-items:center;gap:9px}
.footer-sym{font-family:var(--serif);font-size:16px;color:var(--gold)}
.footer-txt{font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;letter-spacing:.18em}
.footer-tag{font-size:9px;color:rgba(255,255,255,.25);font-family:var(--label);letter-spacing:.18em;margin-left:16px}
.footer-links{display:flex;gap:28px}
.footer-links a{font-size:11px;color:rgba(255,255,255,.35);font-family:var(--sans);font-weight:400;transition:color .2s}
.footer-links a:hover{color:rgba(255,255,255,.7)}
.footer-line{border-top:1px solid rgba(255,255,255,.05);padding-top:20px}
.footer-legal{font-size:10px;color:rgba(255,255,255,.18);font-family:var(--sans);line-height:1.7;font-weight:300}

/* RESPONSIVE TABLET */
@media(max-width:1023px){
  .nav{padding:0 28px;height:64px}
  .nav-links{display:none}
  .hero{grid-template-columns:1fr}
  .hero-copy{padding:56px 32px 48px;order:2}
  .hero-h1{font-size:52px}
  .hero-photo{min-height:420px;order:1}
  .truth{padding:80px 32px}
  .truth-h2{font-size:38px}
  .product{padding:80px 32px}
  .product-inner{grid-template-columns:1fr;gap:48px}
  .product-photo{max-width:400px}
  .howto{padding:80px 32px}
  .howto-inner{grid-template-columns:1fr;gap:48px}
  .howto-photo{max-width:400px}
  .women{padding:80px 32px}
  .women-head{grid-template-columns:1fr;gap:32px}
  .women-tagline{text-align:left}
  .wcard.tall,.wcard.side{height:340px}
  .wcard.wide{grid-column:1 / -1;height:340px}
  .about{padding:80px 32px}
  .about-inner{grid-template-columns:1fr;gap:52px}
  .about-h2{font-size:40px}
  .newsletter{padding:72px 32px}
  .footer{padding:40px 32px 24px}
  .footer-top{flex-direction:column;align-items:flex-start;gap:20px}
}

/* RESPONSIVE MOBILE */
@media(max-width:767px){
  .nav{padding:0 20px;height:60px}
  .nav-logo-txt{font-size:15px}
  .nav-right .nav-cta{display:none}
  .hamburger{display:flex}
  .hero-copy{padding:40px 20px 40px}
  .hero-h1{font-size:40px}
  .hero-photo{min-height:300px}
  .hero-stats{grid-template-columns:repeat(2,1fr);gap:16px;padding-top:20px}
  .stat{padding-left:14px}
  .truth{padding:64px 20px}
  .truth-h2{font-size:30px}
  .truth-sub{font-size:14px;margin-bottom:36px}
  .truth-row{grid-template-columns:1fr;gap:10px}
  .truth-good{border-left:none;padding-left:0;border-top:1px solid var(--salmon-l);padding-top:10px}
  .product{padding:64px 20px}
  .product-inner{gap:36px}
  .product-h2{font-size:34px}
  .howto{padding:64px 20px}
  .howto-h2{font-size:34px}
  .women{padding:64px 20px}
  .women-h2{font-size:34px}
  .women-grid{grid-template-columns:1fr 1fr}
  .wcard.tall{height:260px}
  .wcard.wide{grid-column:span 2;height:260px}
  .wcard.side{height:260px}
  .women-grid .wcard:nth-child(3){grid-column:span 2}
  .women-grid .wcard:nth-child(3){grid-column:1 / -1;height:300px}
  .about{padding:64px 20px}
  .about-h2{font-size:34px}
  .value-row{grid-template-columns:1fr;gap:8px}
  .newsletter{padding:56px 20px}
  .newsletter-h2{font-size:28px}
  .email-row{flex-direction:column}
  .email-inp{border-right:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:2px 2px 0 0}
  .email-btn{border-radius:0 0 2px 2px;padding:14px}
  .footer{padding:36px 20px 20px}
  .footer-links{flex-wrap:wrap;gap:16px}
  .footer-tag{display:none}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="nav-logo-sym">∞</span>
    <span class="nav-logo-txt">LONVIQ</span>
  </div>
  <div class="nav-links" id="nav-links"></div>
  <div class="nav-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('EN')">EN</button>
      <button class="lang-btn" id="btn-de" onclick="setLang('DE')">DE</button>
    </div>
    <a href="#" onclick="return false;" class="nav-cta" id="nav-cta"></a>
    <div class="hamburger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu"></div>

<section class="hero">
  <div class="hero-copy">
    <div class="eyebrow" id="h-eyebrow"></div>
    <h1 class="hero-h1" id="h-h1"></h1>
    <p class="hero-sub" id="h-sub"></p>
    <div class="hero-cta-wrap">
      <a href="#" onclick="return false;" class="btn-primary" id="h-cta"></a>
      <span class="btn-sub" id="h-ctasub"></span>
    </div>
    <div class="hero-stats" id="h-stats"></div>
  </div>
  <div class="hero-photo">
    <img src="https://raw.githubusercontent.com/Lonviq2026/lonviq-website/main/hero-main.png" alt="Woman preparing LONVIQ collagen drink" loading="eager">
    <div class="hero-overlay"></div>
  </div>
</section>

<section class="truth">
  <div class="truth-inner">
    <div class="eyebrow" id="tr-eyebrow"></div>
    <h2 class="truth-h2" id="tr-h2"></h2>
    <p class="truth-sub" id="tr-sub"></p>
    <div class="truth-cols-header">
      <div class="truth-col-label" id="tr-col-std"></div>
      <div class="truth-col-label right" id="tr-col-lnv"></div>
    </div>
    <div id="tr-rows"></div>
    <div class="truth-border"></div>
    <p class="truth-fn" id="tr-fn"></p>
  </div>
</section>

<section class="product">
  <div class="product-inner">
    <div class="product-photo">
      <img src="https://raw.githubusercontent.com/Lonviq2026/lonviq-website/main/still-life.png" alt="LONVIQ Kollagen Beauty" loading="lazy">
    </div>
    <div class="product-copy">
      <div>
        <div class="eyebrow" id="pr-eyebrow"></div>
        <h2 class="product-h2" id="pr-h2"></h2>
        <div class="product-wt" id="pr-wt"></div>
      </div>
      <p class="product-desc" id="pr-desc"></p>
      <div class="ing-list" id="pr-ings"></div>
      <div class="product-cta-wrap">
        <a href="#" onclick="return false;" class="btn-primary" id="pr-cta"></a>
        <span class="product-legal" id="pr-legal"></span>
      </div>
    </div>
  </div>
</section>

<section class="howto">
  <div class="howto-inner">
    <div class="howto-copy">
      <div>
        <div class="eyebrow" id="hw-eyebrow"></div>
        <h2 class="howto-h2" id="hw-h2"></h2>
      </div>
      <div class="steps" id="hw-steps"></div>
      <div class="howto-note" id="hw-note"></div>
