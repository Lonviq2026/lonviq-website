let lang = 'DE';

function setLang(l) {
  lang = l;
  document.getElementById('btn-de').classList.toggle('active', l === 'DE');
  document.getElementById('btn-en').classList.toggle('active', l === 'EN');
  document.documentElement.lang = COPY[l].lang;
  try { localStorage.setItem('lonviq_lang', l.toLowerCase()); } catch(e){}
  render();
}

  // Quality

  document.getElementById('q-sub').textContent = c.quality.sub;
  document.getElementById('pillars').innerHTML = c.quality.pillars.map(p =>
    `<div class="pillar">
      <div class="pillar-icon">${p.icon}</div>
      <div class="pillar-title">${p.title}</div>
      <div class="pillar-text">${p.text}</div>
    </div>`
  ).join('');
  document.getElementById('q-legal').textContent = c.quality.legal;

  // Review
  document.getElementById('r-eyebrow').textContent = c.review.eyebrow;
  document.getElementById('r-h2').innerHTML = c.review.h2;
  document.getElementById('r-sub').textContent = c.review.sub;
  document.getElementById('r-points').innerHTML = c.review.points.map(p =>
    `<div class="review-point">
      <span class="rp-check">&#10003;</span>
      <span class="rp-text">${p}</span>
    </div>`
  ).join('');
  document.getElementById('r-btn').textContent = c.review.btn;
  document.getElementById('r-legal').innerHTML = c.review.legal.replace('\n', '<br>');

  // Coupon
  document.getElementById('c-eyebrow').textContent = c.coupon.eyebrow;
  document.getElementById('c-h2').innerHTML = c.coupon.h2;
  document.getElementById('c-sub').textContent = c.coupon.sub;
  document.getElementById('c-label').textContent = c.coupon.label;
  document.getElementById('c-value').textContent = c.coupon.value;

  document.getElementById('copy-btn').textContent = c.coupon.copyBtn;
  document.getElementById('c-validity').innerHTML = c.coupon.validity.replace('\n', '<br>');
  document.getElementById('c-btn').textContent = c.coupon.btn;

  // Footer
  document.getElementById('footer-links').innerHTML = c.footer.links.map(l =>
    `<a href="${l.u}">${l.t}</a>`
  ).join('');
  document.getElementById('footer-legal').textContent = c.footer.legal;
}

function copyCode() {
  const code = 'LONVIQ10';
  const btn = document.getElementById('copy-btn');
  const copied = COPY[lang].coupon.copied;
  const original = COPY[lang].coupon.copyBtn;
  navigator.clipboard.writeText(code).then(function() {
    btn.textContent = copied;
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 3000);
  }).catch(function() {
    const el = document.createElement('textarea');
    el.value = code;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    btn.textContent = copied;
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 3000);
  });
}

/* language bootstrap: honour an explicit choice, else Polish IP -> Polish
   (Cloudflare /cdn-cgi/trace, no PL button — consistent with the homepage) */
(function(){
  var saved; try { saved = localStorage.getItem('lonviq_lang'); } catch(e){}
  if (saved) { setLang(saved.toUpperCase()); return; }
  render();
  fetch('/cdn-cgi/trace').then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/^loc=([A-Z]{2})/m);
    if (m && m[1] === 'PL') setLang('PL');
  }).catch(function(){});
})();
</script>
